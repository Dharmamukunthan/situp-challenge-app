include ':app'

def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
def properties = new Properties()

def flutterSdkPath
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { properties.load(it) }
    flutterSdkPath = properties.getProperty("flutter.sdk")
}

if (flutterSdkPath == null) {
    flutterSdkPath = System.env.FLUTTER_ROOT
}

if (flutterSdkPath == null) {
    throw GradleException("Flutter SDK not found.")
}

def flutterRoot = flutterSdkPath
apply from: "$flutterRoot/packages/flutter_tools/gradle/app_plugin_loader.gradle"
