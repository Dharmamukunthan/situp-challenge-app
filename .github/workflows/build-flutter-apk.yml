name: Build Flutter APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter 3.22.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"
          channel: stable

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses
        continue-on-error: true

      - name: Get dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build debug APK
        working-directory: flutter_app
        run: flutter build apk --debug

      - name: Find and copy APK
        run: |
          find flutter_app/build -name "*.apk" -type f
          cp flutter_app/build/app/outputs/flutter-apk/app-debug.apk ./app-debug.apk 2>/dev/null || \
          cp $(find flutter_app/build -name "*.apk" -type f | head -1) ./app-debug.apk 2>/dev/null || \
          echo "APK_NOT_FOUND"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: situp-challenge-apk
          path: app-debug.apk
          retention-days: 30
