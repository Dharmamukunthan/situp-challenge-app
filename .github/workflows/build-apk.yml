name: Build Android APK

on:
  workflow_dispatch:  # Manual trigger from phone

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/camera @capacitor/android

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from "@capacitor/cli";
          const config: CapacitorConfig = {
            appId: "com.dharmamukunthan.situpchallenge",
            appName: "Situp Challenge",
            webDir: "dist",
            server: {
              androidScheme: "https",
              cleartext: true
            },
            plugins: {
              Camera: {
                androidPermissions: ["android.permission.CAMERA"]
              }
            }
          };
          export default config;
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: situp-challenge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
